# Development Docker Compose configuration.
# - Mounts source code for live development.
# - Runs Next.js with hot reload (webpack; Turbopack is unstable on Windows bind mounts).
# - Expects the backend API at NEXT_PUBLIC_API_URL (default: http://localhost:8000/api).

services:
  frontend:
    image: node:22-alpine
    container_name: satlife-frontend-dev
    working_dir: /app
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app:delegated
      - satlife_frontend_node_modules:/app/node_modules
      - satlife_frontend_next:/app/.next
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000 --webpack"

volumes:
  satlife_frontend_node_modules:
  satlife_frontend_next:
