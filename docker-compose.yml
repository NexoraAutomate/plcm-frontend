# Production-style frontend stack.
# Builds the Next.js standalone image from Dockerfile.
# NEXT_PUBLIC_API_URL is baked at build time. Prefer localhost here: the app
# rewrites that hostname to the page origin at runtime so LAN Docker access works.

services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    container_name: satlife-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
